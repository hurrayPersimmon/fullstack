<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <child-component></child-component>
    </div>

    <script src="https://unpkg.com/vue"></script>
    <script>
      var app = Vue.createApp({
        name: 'app',
        data() {
          return { message: '소리 없는 아우성' };
        },
        methods: {
          printText(...args) {
            alert(args[0]);
          },
        },
      });

      app.component('child-component', {
        data() {
          return {};
        },

        methods: {
          showLog() {
            // console.log(this);
            this.$emit('show-log', 100);
          },
        },
        template: '<button v-on:click= "showLog">button</button>',
      });
      app.mount('#app');
    </script>
  </body>
</html>
