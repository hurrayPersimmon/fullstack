<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container mt-3">
      <form>
        <h1><i class="fa-solid fa-user-plus mb-3 mt-3"></i> Sign in</h1>
        <div class="mb-3 mt-3">
          <label for="username"
            ><i class="fa-solid fa-user"></i> Username:</label
          >
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Enter username"
            name="username"
          />
        </div>
        <div class="mb-3">
          <label for="pwd"><i class="fa-solid fa-lock"></i> Password:</label>
          <input
            type="password"
            class="form-control"
            id="pwd"
            placeholder="Enter password"
            name="pswd"
          />
        </div>

        <div class="mb-3">
          <label for="pwdc"
            ><i class="fa-solid fa-lock"></i> Confirm Password:</label
          >
          <input
            type="password"
            class="form-control"
            id="pwdc"
            placeholder="Confirm password"
            name="pswdc"
          />
        </div>
        <div class="mb-3">
          <label for="email"
            ><i class="fa-regular fa-envelope"></i> email:</label
          >
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter email"
            name="email"
          />
        </div>

        <div class="mb-3 mt-3">
          <label for="avatar"
            ><i class="fa-solid fa-user-astronaut"></i> avartar image</label
          >
          <input type="file" class="form-control" id="avatar" name="avatar" />
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary center">Submit</button>
        </div>
      </form>
    </div>
  </body>
</html>
