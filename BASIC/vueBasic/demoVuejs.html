<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="appTest">
      <h2>{{message}}</h2>
    </div>
    <!-- cdn 방식 -->
    <script src="https://unpkg.com/vue"></script>
    <script>
      var model = {
        message: '소리 없는 아우성!',
      };

      var app = Vue.createApp({
        name: 'Main',

        data() {
          return model;
        },
      });
      var vm = app.mount('#appTest');
    </script>
  </body>
</html>
